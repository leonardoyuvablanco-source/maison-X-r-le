<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html><head>
<meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>index.html</title>




<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini ChatGPT sécurisé</title>

<style>
body{background:#0d1117;color:white;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{color:#00aaff;}
.chat-box{width:100%;max-width:600px;height:400px;background:#111;border:2px solid #00ff88;border-radius:15px;padding:15px;overflow-y:auto;margin-bottom:15px;}
.message{margin:10px 0;padding:10px;border-radius:10px;word-break:break-word;}
.user{background:#0055ff;text-align:right;}
.bot{background:#00ff88;text-align:left;}
.chat-input{display:flex;width:100%;max-width:600px;}
.chat-input input{flex:1;padding:10px;border-radius:10px 0 0 10px;border:none;outline:none;font-size:16px;}
.chat-input button{padding:10px 20px;border:none;border-radius:0 10px 10px 0;cursor:pointer;font-weight:bold;background:linear-gradient(270deg,#00ff88,#00cc55,#00ff88);background-size:400% 400%;animation:greenGlow 4s ease infinite;color:white;transition:0.3s;}
.chat-input button:hover{transform:scale(1.05);}
@keyframes greenGlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
</style>
</head><body>
<h1>Mini ChatGPT sécurisé</h1>
<div class="chat-box" id="chatBox"></div>
<div class="chat-input">
<input id="userInput" placeholder="Écris quelque chose..." type="text">
<button onclick="sendMessage()">Envoyer</button>
</div>
<script>
const chatBox = document.getElementById('chatBox');
async function sendMessage(){
const input = document.getElementById('userInput');
const message = input.value.trim();
if(!message) return;
addMessage('user', message);
input.value='';
try{
const response = await fetch('/chat',{
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({message})
});
const data = await response.json();
addMessage('bot', data.reply || data.error || 'Erreur inconnue');
} catch(err){
addMessage('bot','Erreur : impossible de contacter le serveur');
console.error(err);
}
}
function addMessage(type,text){
const msg = document.createElement('div');
msg.classList.add('message', type);
msg.textContent = text;
chatBox.appendChild(msg);
chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

<br>
</body></html>
