<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at center,#111 0%,#000 100%);
font-family:Arial, sans-serif;
}
/* Conteneur pour effet glow externe */
.btn-wrapper{
position:relative;
}
/* Halo animé derrière */
.btn-wrapper::before{
content:'';
position:absolute;
top:-20px;
left:-20px;
right:-20px;
bottom:-20px;
background:linear-gradient(270deg,#00f2ff,#0066ff,#00f2ff);
background-size:400% 400%;
filter:blur(40px);
opacity:0.7;
border-radius:30px;
animation:glowMove 5s ease infinite;
z-index:0;
}
/* Bouton principal */
.blue-btn{
position:relative;
padding:20px 60px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:20px;
cursor:pointer;
color:white;
background:linear-gradient(270deg,#00c6ff,#0072ff,#00c6ff);
background-size:400% 400%;
animation:blueMove 4s ease infinite;
transition:0.2s;
z-index:1;
box-shadow:0 0 30px rgba(0,150,255,0.8);
letter-spacing:2px;
}
/* Hover effet */
.blue-btn:hover{
transform:scale(1.2) rotate(-1deg);
box-shadow:0 0 60px rgba(0,200,255,1);
}
/* Click effet */
.blue-btn:active{
transform:scale(1.05);
}
/* Animations */
@keyframes blueMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
@keyframes glowMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
</style>

<div class="btn-wrapper">
<a href="support.html"><button class="blue-btn">
CONTINUER
</button></a>
</div>
</body></html>
