<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Créer un compte</title>

<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:white;font-family:Arial;}
.container{background:#111;padding:40px;border-radius:15px;box-shadow:0 0 30px #00aaff;width:320px;text-align:center;color:white;}
.input-group{margin-bottom:15px;text-align:left;position:relative;}
label{font-size:14px;margin-bottom:5px;display:block;}
input{width:100%;padding:10px;border:none;border-radius:8px;outline:none;background:#222;color:white;}
input:focus{box-shadow:0 0 10px #00aaff;}
.toggle-password{position:absolute;right:10px;top:35px;cursor:pointer;color:#00aaff;}
.link{display:block;margin-top:8px;font-size:13px;color:#00aaff;text-decoration:none;}
button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;background:linear-gradient(45deg,#007bff,#00aaff);color:white;margin-top:10px;animation:glow 2s infinite alternate;}
button:disabled{background:gray;cursor:not-allowed;animation:none;}
.retour{background:#333;animation:none;}
.retour:hover{background:#555;}
@keyframes glow{from{box-shadow:0 0 10px #00aaff;}to{box-shadow:0 0 25px #00aaff;}}
.loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:white;display:flex;justify-content:center;align-items:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.5s;z-index:9999;}
.loading-screen.active{opacity:1;pointer-events:all;}
.progress-bar{width:300px;height:20px;background:#222;border-radius:10px;margin-top:20px;overflow:hidden;}
.progress{height:100%;width:0%;background:linear-gradient(90deg,#007bff,#00aaff);transition:width 0.1s;}
.error{color:#ff4b5c;font-size:13px;margin-top:5px;}
</style></head>
<body>
<div class="container" id="formContainer">
<h2>Créer un compte</h2>
<div class="input-group">
<label>Prénom</label>
<input id="prenom" type="text"></div>
<div class="input-group">
<label>Email</label>
<input id="email" type="email"></div>
<div class="input-group">
<label>Mot de passe</label>
<input id="password" type="password"><span class="toggle-password" id="togglePassword">👁</span>
<div class="error" id="errorMessage"></div>
<a href="#" class="link" onclick="alert('Fonction récupération à créer 😎')">Mot de
passe oublié ?</a>
</div>
<button id="submitBtn" disabled="disabled">Valider</button>
<button class="retour" onclick="alert('Retour page2 😎')">Retour
à la page2</button>
</div>
<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
<h2><a href="Pagennn234.html">Chargeme</a></h2>
<div class="progress-bar">
<div class="progress" id="progress"><a href="Pagennn234.html"></a></div>
<a href="Pagennn234.html"></a></div>
</div>
<!-- Son -->
<audio id="clickSound"><source src="https://www.soundjay.com/buttons/sounds/button-3.mp3" type="audio/mpeg"></source>
<script>
const prenom = document.getElementById("prenom");
const email = document.getElementById("email");
const password = document.getElementById("password");
const button = document.getElementById("submitBtn");
const errorMessage = document.getElementById("errorMessage");
const container = document.getElementById("formContainer");
const togglePassword = document.getElementById("togglePassword");
const loadingScreen = document.getElementById("loadingScreen");
const progress = document.getElementById("progress");
const clickSound = document.getElementById("clickSound");
function checkInputs(){
if(prenom.value && email.value && password.value.length >= 8){
button.disabled = false;
errorMessage.textContent = "";
} else {
button.disabled = true;
}
}
prenom.addEventListener("input", checkInputs);
email.addEventListener("input", checkInputs);
password.addEventListener("input", checkInputs);
togglePassword.addEventListener("click", () => {
password.type = password.type === "password" ? "text" : "password";
});
button.addEventListener("click", () => {
if(password.value.length < 8){
errorMessage.textContent = "Votre mot de passe doit contenir au moins 8 caractères.";
return;
}
clickSound.play();
const user = { prenom: prenom.value, email: email.value };
localStorage.setItem("compteLeo", JSON.stringify(user));
loadingScreen.classList.add("active");
let width = 0;
let interval = setInterval(() => {
width++;
progress.style.width = width + "%";
if(width >= 100){
clearInterval(interval);
setTimeout(() => {
// Redirection vers nouvelle page privée
window.location.href = "compte aaa vvvooouuusss.html";
}, 500);
}
}, 30);
});
</script></audio>
</body></html>
