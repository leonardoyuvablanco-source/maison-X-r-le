.page{

.gaming-btn{
display:block;

padding:15px;

font-weight:bold;
border:none;
border-radius:12px;
cursor:pointer;

background-size:400% 400%;
animation:blueGlow 4s ease infinite;
box-shadow:0 0 15px rgba(0,170,255,0.6);
transition:0.3s;
}
.gaming-btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px rgba(0,170,255,1);
}
@keyframes blueGlow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
/* Pages bloquées */
.locked{
pointer-events:none;
}
/* Bouton retour */
.retour{
margin-top:40px;
background:#333;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;

}
